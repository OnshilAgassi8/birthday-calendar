<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Woosung's Birthday Calendar</title>
    <link rel="stylesheet" href="styles.css" />
    
  </head>
  <body>
    <h1>Woosung's Birthday Calendar</h1>

    <div id="calendar">
      <div class="calendar-header">
        <button id="prevBtn">‹</button>
        
        <div id="monthTitle"></div>

        <button id="nextBtn">›</button>
      </div>

      <div id="weekdays"></div>
      <div id="daysGrid"></div>
    </div>


    <div id="popupOverlay" class="hidden">
      <div class="popup-card">
        <h2 id="popupTitle">Add Birthday</h2>
        <input type="text" id="nameValue" placeholder="Name" />
        <input type="time" id="timeValue" />
        <button id="saveBtn">Save</button>
        <button id="closeBtn">Close</button>

         <div id="birthdayList"></div> 
      </div>
    </div>


    <script src="script.js"></script>
  </body>
</html>
